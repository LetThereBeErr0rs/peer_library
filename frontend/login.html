<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in — Peer Library</title>
    <meta name="description" content="Sign in to your Peer Library account to share and manage resources.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">

    <script src="js/theme.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">
    <a class="visually-hidden-focusable skip-link" href="#main-content">Skip to content</a>

    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" class="text-primary" aria-hidden="true">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                Peer Library
            </a>

            <div class="d-flex align-items-center gap-2 order-lg-3">
                <button class="btn btn-toggle-theme" id="themeToggle" type="button"
                    aria-label="Toggle light and dark theme">
                    <i class="fa-solid fa-moon" id="themeIcon" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </nav>

    <main id="main-content" class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="glass-panel">
                    <h1 class="h3 fw-bold mb-4 text-center">Welcome back</h1>

                    <div class="alert alert-danger" id="loginAlert" style="display: none;" role="alert"></div>

                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" autocomplete="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password" autocomplete="current-password" required>
                                <button class="btn btn-outline-secondary toggle-password" type="button"
                                    data-target="password" aria-label="Show password">
                                    <i class="fa-regular fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-human w-100" id="loginSubmitBtn">Log in</button>
                    </form>
                    <p class="text-center text-muted small mt-3 mb-0">
                        No account yet? <a href="register.html">Sign up</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 mt-5 text-center text-muted border-top border-opacity-10 site-footer">
        <div class="container">
            <p class="mb-0 small">Peer Library — built by students, for students. Share notes, papers and study materials with your peers.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
