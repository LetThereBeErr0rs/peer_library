# Render Blueprint configuration for Peer Library API backend.
# Reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: peer-library-api
    runtime: python
    region: oregon # adjust to match your Supabase region if needed
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask db upgrade
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT --access-logfile - app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: resources
      - key: SUPABASE_SIGNED_URL_TTL
        value: "120"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "Lax"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
