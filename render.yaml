# Render Blueprint configuration for Peer Library API backend.
# Reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: peer-library-api
    runtime: python
    region: oregon # adjust to match your Supabase region if needed
    plan: free
    # Note: Render's Free tier does not support 'preDeployCommand'. On the free plan,
    # running migrations during buildCommand executes them safely once per build,
    # with the configured environment variables, and halts deployment on error.
    # If upgrading to a paid 'starter' plan, you can switch to:
    # preDeployCommand: python -m flask --app app db upgrade
    buildCommand: pip install -r requirements.txt && python -m flask --app app db upgrade
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT --access-logfile - app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # In Render (IPv4 environment), use Supabase's Session Pooler (port 5432)
      # or Direct Connection (port 5432 if IPv6 is supported).
      # Do NOT use the Transaction Pooler (port 6543) for this persistent Gunicorn app.
      # Obtain actual values from Supabase Dashboard -> Connect.
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: resources
      - key: SUPABASE_SIGNED_URL_TTL
        value: "120"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "Lax"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
